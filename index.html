<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Observ'BF</title>
<meta name="description" content="Boxe française – Savate (CA4) : observation des touches, chrono, tournoi de classe, piliers d'apprentissage. N'EPS numérique.">
<meta name="theme-color" content="#13285A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Observ'BF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <button class="tb-home" data-action="home" aria-label="Accueil"><img src="icons/icon-192.png" alt=""></button>
  <div class="tb-title"><div id="tb-main">Observ'BF</div><div id="tb-sub"></div></div>
  <div id="tb-right"></div>
</header>
<main id="main"></main>

<!-- ============ ASSAUT (plein écran) ============ -->
<section id="fight" hidden>
  <header class="fight-top">
    <div class="score-card red">
      <div class="sc-info"><span class="sc-corner">Rouge</span><b id="fNameR">—</b><small id="fSubR"></small><span class="sc-bonus" id="fBonusR" hidden></span></div>
      <span class="sc-score" id="fScoreR">0</span>
    </div>
    <div class="clock" id="clock">
      <div class="clock-line"><span class="phase" id="cPhase">Prêt</span><span class="rep" id="cRep">Reprise 1/2</span></div>
      <div class="time" id="cTime">1:30</div>
      <div class="clock-btns">
        <button class="cbtn" id="cReset" aria-label="Remettre la reprise à zéro">↺</button>
        <button class="cbtn main" id="cStart">Départ</button>
        <button class="cbtn" id="cSkip">Fin de reprise</button>
      </div>
    </div>
    <div class="score-card blue">
      <span class="sc-score" id="fScoreB">0</span>
      <div class="sc-info right"><span class="sc-corner">Bleu</span><b id="fNameB">—</b><small id="fSubB"></small><span class="sc-bonus" id="fBonusB" hidden></span></div>
    </div>
  </header>
  <div class="fight-sub">
    <button class="btn small" id="fMenu">Menu</button>
    <span id="fJudges" class="judges-line"></span>
    <span class="xsel" id="xsel" hidden><span class="lbl">Je observe</span><button class="xs R" data-xs="R" aria-label="Le tireur rouge">🔴</button><button class="xs B" data-xs="B" aria-label="Le tireur bleu">🔵</button></span>
    <button class="btn small" id="fEnd" title="Appui long : déclarer un abandon">Terminer l'assaut</button>
  </div>
  <main class="arena" id="arena">
    <section class="half red" data-side="R">
      <div class="banner" id="bannerR"></div>
      <div class="target" data-side="R" id="targetR"></div>
      <div class="coach" id="coachR" hidden></div>
      <div class="origin" id="originR"></div>
      <div class="side-ctrl">
        <button class="sbtn ench" data-side="R" data-act="ench" aria-label="Enchaînement" title="Enchaînement (ou double tap)">🔗</button>
        <button class="sbtn warn" data-side="R" data-act="trop" aria-label="Frappe trop forte" title="Dernière frappe trop forte">💥</button>
        <button class="sbtn" data-side="R" data-act="undo" aria-label="Annuler la dernière touche" title="Annuler">↩️</button>
      </div>
    </section>
    <section class="half blue" data-side="B">
      <div class="banner" id="bannerB"></div>
      <div class="target" data-side="B" id="targetB"></div>
      <div class="coach" id="coachB" hidden></div>
      <div class="origin" id="originB"></div>
      <div class="side-ctrl">
        <button class="sbtn" data-side="B" data-act="undo" aria-label="Annuler la dernière touche" title="Annuler">↩️</button>
        <button class="sbtn warn" data-side="B" data-act="trop" aria-label="Frappe trop forte" title="Dernière frappe trop forte">💥</button>
        <button class="sbtn ench" data-side="B" data-act="ench" aria-label="Enchaînement" title="Enchaînement (ou double tap)">🔗</button>
      </div>
    </section>
    <canvas id="trail"></canvas>
  </main>
</section>

<dialog id="resultDlg"><div id="resultBody"></div></dialog>
<div id="modal-root"></div>
<div id="sig">By Quentin Delisle &amp; Simon Gautier</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dragGhost" hidden></div>

<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/zxing-reader.js"></script>
<script src="lib/xlsx.full.min.js" defer></script>
<script src="js/figures.js"></script>
<script src="js/draw.js"></script>
<script src="js/boxe-saisie.js"></script>
<script src="js/qr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
